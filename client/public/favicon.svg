
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#shieldBorder)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Background Subtle Grid -->
  <circle cx="256" cy="256" r="180" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Modern Dynamic "X" & Cable Lightning Motif -->
  <g filter="url(#glow)">
    <!-- X Stroke 1: Diagonal Right (Cyan Fiber) -->
    <path d="M140 140 L372 372" stroke="url(#neonCyan)" stroke-width="42" stroke-linecap="round" />
    
    <!-- X Stroke 2: Diagonal Left (Magenta / Red Comcast Accent) -->
    <path d="M372 140 L280 232" stroke="url(#neonRed)" stroke-width="42" stroke-linecap="round" />
    <path d="M232 280 L140 372" stroke="url(#neonRed)" stroke-width="42" stroke-linecap="round" />

    <!-- Central Lightning Bolt Core in Gold/Cyan -->
    <polygon points="275,185 220,270 265,270 235,335 295,245 250,245" fill="#fde047" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Cable Connection Nodes -->
  <circle cx="140" cy="140" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  <circle cx="372" cy="372" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  <circle cx="372" cy="140" r="14" fill="#fb7185" stroke="#ffffff" stroke-width="4" />
  <circle cx="140" cy="372" r="14" fill="#fb7185" stroke="#ffffff" stroke-width="4" />

  <!-- Bottom Tech Badge Label -->
  <rect x="136" y="415" width="240" height="42" rx="21" fill="#0f172a" fill-opacity="0.85" stroke="url(#neonCyan)" stroke-width="2" />
  <text x="256" y="442" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" letter-spacing="4" text-anchor="middle">XFINITY TECH</text>
</svg>
